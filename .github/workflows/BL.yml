name: BL.yml

on:
  workflow_dispatch: {}      # + можно запустить руками

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Build & push config
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
        run: python scripts/auto/build_config.py
