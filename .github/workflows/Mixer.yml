name: Mixer

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

concurrency:
  group: mixer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp_socks

      - name: Install Xray-core
        run: |
          set -e
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run merge & health-check
        run: |
          set -e
          python scripts/Mixer.py

      - name: Check output
        run: |
          set -e

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          COUNT=$(grep -cE '^(vless|vmess|trojan|ss|ssr|hysteria2|hy2|tuic)://' output/sub.txt || true)

          echo "[i] Конфигов в результате: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "[x] Подписка пустая"
            exit 1
          fi

          echo "[+] Проверка результата пройдена"

      - name: Update GitHub Gist
        env:
          GIST_TOKEN: ${{ secrets.PIZDUK_PAT }}
          GIST_ID: "7456b4e460bb7a358b8916368ee92c50"
        run: |
          set -e

          if [ -z "$GIST_TOKEN" ]; then
            echo "[x] GIST_TOKEN не задан"
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]

          with open("output/sub.txt", "r", encoding="utf-8") as f:
              content = f.read()

          if not content.strip():
              raise SystemExit("[x] Файл пустой")

          payload = {
              "files": {
                  "Mixer": {
                      "content": content
                  }
              }
          }

          request = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              },
              method="PATCH"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  print("[+] Gist успешно обновлён")
                  print("[i] Gist:", result["html_url"])
          except urllib.error.HTTPError as e:
              print("[x] Ошибка GitHub API:", e.code)
              print(e.read().decode("utf-8"))
              raise
          PY
