name: Mixer

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

concurrency:
  group: mixer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp_socks

      - name: Install Xray-core
        run: |
          set -e
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run merge & health-check
        run: |
          set -e
          python scripts/Mixer.py

      - name: Check output
        run: |
          set -e

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          COUNT=$(grep -cE '^(vless|vmess|trojan|ss|ssr|hysteria2|hy2|tuic)://' output/sub.txt || true)
          echo "[i] Конфигов в результате: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "[x] Подписка пустая"
            exit 1
          fi

          echo "[+] Проверка результата пройдена"

      - name: Push result to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
          GITVERSE_REPO: ${{ secrets.PIZDUK_REPO }}
        run: |
          set -e

          [ -z "${GITVERSE_TOKEN}" ] && { echo "[x] GITVERSE_TOKEN не задан"; exit 1; }
          [ -z "${GITVERSE_REPO}" ] && { echo "[x] GITVERSE_REPO не задан"; exit 1; }

          git config --global user.email "actions@bots.local"
          git config --global user.name "sub-updater-bot"

          rm -rf gitverse_repo
          echo "[i] Клонирование GitVerse..."
          git clone --quiet "https://oauth2:${GITVERSE_TOKEN}@${GITVERSE_REPO}" gitverse_repo

          cd gitverse_repo

          for i in 1 2 3 4 5; do
            git fetch --quiet origin master
            git reset --hard origin/master

            cp ../output/sub.txt Mixer
            git add Mixer

            if git diff --cached --quiet; then
              echo "[i] Нет изменений"
              exit 0
            fi

            git commit -m "auto: update Mixer $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if git push origin master; then
              echo "[+] Mixer успешно обновлён"
              exit 0
            fi

            echo "[!] Push отклонён, попытка $i/5, повторяю..."
            sleep $((RANDOM % 5 + 3))
          done

          echo "[x] Не удалось запушить после 5 попыток"
          exit 1
