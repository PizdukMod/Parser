name: Mixer

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch: {}

concurrency:
  group: mixer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp_socks

      - name: Install Xray-core
        run: |
          set -e
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run merge & health-check
        run: |
          set -e
          python scripts/Mixer.py

      - name: Check output
        run: |
          set -e

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          COUNT=$(grep -cE '^(vless|vmess|trojan|ss|ssr|hysteria2|hy2|tuic)://' output/sub.txt || true)

          echo "[i] Конфигов в результате: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "[x] Подписка пустая"
            exit 1
          fi

          echo "[+] Проверка результата пройдена"

      - name: Push result to PizdukVPN repository
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          REPO="PizdukMod/PizdukVPN"
          BRANCH="main"
          FILE="Mixer"
          API="https://api.github.com/repos/${REPO}/contents/${FILE}"

          if [ -z "${GH_TOKEN}" ]; then
            echo "[x] GH_PAT не задан"
            exit 1
          fi

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          # Всё большое — только через файлы (аргумент командной строки ограничен ~128 КБ)
          echo "[i] Кодирую подписку..."
          base64 -w 0 output/sub.txt > /tmp/content.b64

          for ATTEMPT in 1 2 3; do
            echo "[i] Получаю SHA существующего файла (попытка ${ATTEMPT})..."

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}?ref=${BRANCH}" > /tmp/existing.json

            SHA=$(jq -r '.sha' /tmp/existing.json)

            if [ -z "${SHA}" ] || [ "${SHA}" = "null" ]; then
              echo "[x] Не удалось получить SHA файла"
              exit 1
            fi

            jq -n \
              --arg message "Update VPN subscription" \
              --arg branch "${BRANCH}" \
              --arg sha "${SHA}" \
              --rawfile content /tmp/content.b64 \
              '{
                message: $message,
                content: $content,
                branch: $branch,
                sha: $sha
              }' > /tmp/payload.json

            echo "[i] Загружаю новую подписку..."

            HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
              -X PUT "${API}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/payload.json)

            if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
              break
            fi

            echo "[!] GitHub ответил ${HTTP_CODE}: $(head -c 300 response.json)"

            if [ "${ATTEMPT}" = "3" ] || { [ "${HTTP_CODE}" != "409" ] && [ "${HTTP_CODE}" != "422" ]; }; then
              echo "[x] Не удалось обновить файл"
              exit 1
            fi

            sleep 5
          done

          echo "[+] Репозиторий успешно обновлён!"
          echo "[i] Репозиторий: ${REPO}"
          echo "[i] Ветка: ${BRANCH}"
          echo "[i] Файл: ${FILE}"
          echo "[i] https://github.com/${REPO}/blob/${BRANCH}/${FILE}" 
