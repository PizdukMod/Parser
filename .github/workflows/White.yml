name: White list update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp_socks

      - name: Install Xray-core
        run: |
          set -e
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run merge & health-check
        run: |
          set -e
          python scripts/White_sub.py


      - name: Check output
        run: |
          set -e

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          COUNT=$(grep -cE '^(vless|vmess|trojan|ss|ssr|hysteria2|hy2|tuic)://' output/sub.txt || true)

          echo "[i] Конфигов в результате: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "[x] Подписка пустая"
            exit 1
          fi

          echo "[+] Проверка результата пройдена"

      - name: Push result to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
          GITVERSE_REPO: ${{ secrets.PIZDUK_REPO }}
        run: |
          set -e

          if [ -z "${GITVERSE_TOKEN}" ]; then
            echo "[x] GITVERSE_TOKEN не задан"
            exit 1
          fi

          if [ -z "${GITVERSE_REPO}" ]; then
            echo "[x] GITVERSE_REPO не задан"
            exit 1
          fi

          git config --global user.email "actions@bots.local"
          git config --global user.name "sub-updater-bot"

          rm -rf gitverse_repo

          echo "[i] Клонирование GitVerse..."

          git clone --quiet \
            "https://oauth2:${GITVERSE_TOKEN}@${GITVERSE_REPO#https://}" \
            gitverse_repo

          echo "[i] Обновление WlSubPiz.txt..."

          cp output/sub.txt gitverse_repo/WlSubPiz.txt

          cd gitverse_repo

          git add WlSubPiz.txt

          if git diff --cached --quiet; then
            echo "[i] Нет изменений"
            exit 0
          fi

          git commit \
            -m "auto: update WlSubPiz.txt $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push

          echo "[+] WlSubPiz.txt успешно обновлён"
      - name: Push result to GitHub Gist
        env:
          GH_TOKEN: ${{ secrets.PIZDUK_PAT }}
        run: |
          set -e

          [ -z "${GH_TOKEN}" ] && {
            echo "[x] GH_PAT не задан"
            exit 1
          }

          [ -f "output/sub.txt" ] || {
            echo "[x] output/sub.txt не найден"
            exit 1
          }

          GIST_ID="66d338db037b345022b7d827ca0112f1"

          echo "[i] Обновляю GitHub Gist..."

          PAYLOAD=$(jq -n \
            --arg content "$(cat output/sub.txt)" \
            '{files: {"wl": {content: $content}}}')

          curl -sS --fail-with-body \
            -X PATCH \
            "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"

          echo "[+] Белый список успешно отправлен в Gist"

  trigger-others:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Trigger Wauto and Whapp
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          FIRST=1
          for wf in Wauto.yml Whapp.yml; do
            if [ "${FIRST}" -eq 0 ]; then
              echo "[i] Жду 10 секунд перед запуском $wf"
              sleep 10
            fi
            FIRST=0

            echo "[i] Запускаю $wf"
            gh workflow run "$wf" --repo PizdukMod/Parser --ref master
            echo "[+] $wf запущен"
          done
