name: White list update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp_socks

      - name: Install Xray-core
        run: |
          set -e
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run merge & health-check
        run: |
          set -e
          python scripts/White_sub.py


      - name: Check output
        run: |
          set -e

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          COUNT=$(grep -cE '^(vless|vmess|trojan|ss|ssr|hysteria2|hy2|tuic)://' output/sub.txt || true)

          echo "[i] Конфигов в результате: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "[x] Подписка пустая"
            exit 1
          fi

          echo "[+] Проверка результата пройдена"

      - name: Push result to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
          GITVERSE_REPO: ${{ secrets.PIZDUK_REPO }}
        run: |
          set -e

          if [ -z "${GITVERSE_TOKEN}" ]; then
            echo "[x] GITVERSE_TOKEN не задан"
            exit 1
          fi

          if [ -z "${GITVERSE_REPO}" ]; then
            echo "[x] GITVERSE_REPO не задан"
            exit 1
          fi

          git config --global user.email "actions@bots.local"
          git config --global user.name "sub-updater-bot"

          rm -rf gitverse_repo

          echo "[i] Клонирование GitVerse..."

          git clone --quiet \
            "https://oauth2:${GITVERSE_TOKEN}@${GITVERSE_REPO#https://}" \
            gitverse_repo

          echo "[i] Обновление WlSubPiz.txt..."

          cp output/sub.txt gitverse_repo/WlSubPiz.txt

          cd gitverse_repo

          git add WlSubPiz.txt

          if git diff --cached --quiet; then
            echo "[i] Нет изменений"
            exit 0
          fi

          git commit \
            -m "auto: update WlSubPiz.txt $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push

          echo "[+] WlSubPiz.txt успешно обновлён"

  trigger-others:
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Wauto and Whapp on GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
        run: |
          set -e
          FIRST=1
          for wf in Wauto.yml Whapp.yml; do
            if [ "${FIRST}" -eq 0 ]; then
              echo "[i] Жду 10 секунд перед запуском $wf"
              sleep 10
            fi
            FIRST=0

            echo "[i] Запускаю $wf"
            CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST \
              "https://api.gitverse.ru/repos/Pizduk/Pars/actions/workflows/${wf}/dispatches?branch=master" \
              -H "Authorization: Bearer ${GITVERSE_TOKEN}" \
              -H "Accept: application/vnd.gitverse.object+json;version=1" \
              -H "Content-Type: application/json" \
              -d '{}')
            if [ "${CODE}" != "204" ]; then
              echo "[x] $wf: HTTP ${CODE}"
              cat resp.txt
              exit 1
            fi
            echo "[+] $wf запущен"
          done