name: bahapp.yml

on:
  workflow_dispatch: {}

concurrency:
  group: bahapp
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Build & push config
        env:
          PIZDUK_PAT: ${{ secrets.PIZDUK_PAT }}
        run: python scripts/auto/bahapp.py
