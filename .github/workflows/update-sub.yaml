name: Update VPN subscription

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-vpn-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp_socks

      - name: Install Xray-core
        run: |
          set -e
          curl -L --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Install sing-box
        run: |
          set -e
          VER=1.12.0
          curl -fL --retry 3 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf sb.tar.gz
          sudo install -m755 "sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Run merge & health-check
        run: |
          set -e
          mkdir -p output

          echo "[i] Файлы в scripts/:"
          ls -la scripts/ || true

          set +e
          python -u scripts/Update_sub.py 2>&1 | tee run.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "[i] Код возврата скрипта: ${RC}"

          # Если скрипт положил файл не туда — находим и копируем
          if [ ! -f output/sub.txt ]; then
            FOUND=$(find . -path ./gitverse_repo -prune -o -type f -name 'sub.txt' -print | head -n 1)
            if [ -n "${FOUND}" ]; then
              echo "[i] sub.txt найден в ${FOUND}, копирую в output/"
              cp "${FOUND}" output/sub.txt
            fi
          fi

          if [ ! -f output/sub.txt ]; then
            echo "[x] Скрипт не создал sub.txt. Последние строки лога:"
            tail -n 50 run.log
            echo "[i] Содержимое рабочей папки:"
            ls -laR output scripts 2>/dev/null | head -n 80
            exit 1
          fi

          if [ "${RC}" -ne 0 ]; then
            echo "[!] Скрипт завершился с кодом ${RC}, но sub.txt есть — продолжаю"
          fi

      - name: Check output
        run: |
          set -e

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          COUNT=$(grep -cE '^(vless|vmess|trojan|ss|ssr|hysteria2|hy2|tuic)://' output/sub.txt || true)
          echo "[i] Конфигов в результате: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "[x] Подписка пустая"
            exit 1
          fi

          echo "[+] Проверка результата пройдена"

      - name: Push result to GitVerse and Github
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
          GITVERSE_REPO: ${{ secrets.PIZDUK_REPO }}
        run: |
          set -e

          [ -z "${GITVERSE_TOKEN}" ] && { echo "[x] GITVERSE_TOKEN не задан"; exit 1; }
          [ -z "${GITVERSE_REPO}" ] && { echo "[x] GITVERSE_REPO не задан"; exit 1; }

          git config --global user.email "actions@bots.local"
          git config --global user.name "sub-updater-bot"

          rm -rf gitverse_repo
          echo "[i] Клонирование GitVerse..."
          git clone --quiet "https://oauth2:${GITVERSE_TOKEN}@${GITVERSE_REPO}" gitverse_repo

          cd gitverse_repo
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          for i in 1 2 3 4 5; do
            git fetch --quiet origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"

            cp ../output/sub.txt sub.txt
            git add sub.txt

            if git diff --cached --quiet; then
              echo "[i] Нет изменений"
              exit 0
            fi

            git commit -m "auto: update subscription $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if git push origin "HEAD:${BRANCH}"; then
              echo "[+] Подписка успешно обновлена"
              exit 0
            fi

            echo "[!] Push отклонён, попытка $i/5, повторяю..."
            sleep $((RANDOM % 5 + 3))
          done

          echo "[x] Не удалось запушить после 5 попыток"
          exit 1
      - name: Push result to GitHub Gist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          [ -z "${GH_TOKEN}" ] && {
            echo "[x] GH_PAT не задан"
            exit 1
          }

          [ -f "output/sub.txt" ] || {
            echo "[x] output/sub.txt не найден"
            exit 1
          }

          GIST_ID="0270547cabecdd08527e2645f3b3672c"

          echo "[i] Подготавливаю обновление Gist..."

          PAYLOAD=$(jq -n \
            --arg content "$(cat output/sub.txt)" \
            '{files: {"sub": {content: $content}}}')

          RESPONSE=$(curl -sS --fail-with-body \
            -X PATCH \
            "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")

          echo "[+] GitHub Gist успешно обновлён!"
          echo "[i] Файл: sub"
          echo "[i] Gist: https://gist.github.com/PizdukMod/${GIST_ID}"

  trigger-others:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Trigger BL, then bahapp (sequentially)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: PizdukMod/Parser
          REF: master
          DELAY_AFTER: "10"
        run: |
          set -e
          API="https://api.github.com/repos/${REPO}"
          H_AUTH="Authorization: Bearer ${GH_TOKEN}"
          H_ACC="Accept: application/vnd.github+json"

          run_and_wait() {
            local wf="$1"
            local start
            start=$(date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%SZ)

            echo "[i] Запускаю ${wf}"
            local code
            code=$(curl -s -o resp.txt -w "%{http_code}" -X POST \
              "${API}/actions/workflows/${wf}/dispatches" \
              -H "${H_AUTH}" -H "${H_ACC}" \
              -d "{\"ref\":\"${REF}\"}")
            if [ "${code}" != "204" ]; then
              echo "[x] ${wf}: HTTP ${code}"; cat resp.txt; return 1
            fi

            # Ищем только что созданный запуск (до ~3 минут)
            local run_id=""
            for i in $(seq 1 36); do
              sleep 5
              run_id=$(curl -s "${API}/actions/workflows/${wf}/runs?event=workflow_dispatch&branch=${REF}&per_page=10" \
                -H "${H_AUTH}" -H "${H_ACC}" \
                | jq -r --arg s "${start}" \
                  '[.workflow_runs[] | select(.created_at >= $s)] | sort_by(.created_at) | first | .id // empty')
              [ -n "${run_id}" ] && break
            done

            if [ -z "${run_id}" ]; then
              echo "[x] ${wf}: запуск не найден"
              return 1
            fi
            echo "[i] ${wf}: run id ${run_id}, жду завершения..."

            # Ждём завершения (до 90 минут)
            local status="" concl=""
            for i in $(seq 1 360); do
              local j
              j=$(curl -s "${API}/actions/runs/${run_id}" -H "${H_AUTH}" -H "${H_ACC}")
              status=$(echo "${j}" | jq -r '.status')
              if [ "${status}" = "completed" ]; then
                concl=$(echo "${j}" | jq -r '.conclusion')
                break
              fi
              sleep 15
            done

            if [ "${status}" != "completed" ]; then
              echo "[x] ${wf}: не дождался завершения"
              return 1
            fi

            echo "[+] ${wf} завершён: ${concl}"
            [ "${concl}" = "success" ] || echo "[!] ${wf} завершился не успешно (${concl})"
            return 0
          }

          run_and_wait BL.yml || echo "[!] Проблема с BL.yml, иду дальше"

          echo "[i] Пауза ${DELAY_AFTER} сек перед bahapp"
          sleep "${DELAY_AFTER}"

          run_and_wait bahapp.yml || echo "[!] Проблема с bahapp.yml"
