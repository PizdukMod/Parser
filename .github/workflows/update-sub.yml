name: Update VPN subscription

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp_socks

      - name: Install Xray-core
        run: |
          set -e
          curl -L --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version
            - name: Install sing-box
        run: |
          set -e
          VER=1.12.0
          curl -fL --retry 3 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf sb.tar.gz
          sudo install -m755 "sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Run merge & health-check
        run: |
          set -e
          mkdir -p output

          echo "[i] Файлы в scripts/:"
          ls -la scripts/ || true

          set +e
          python -u scripts/Update_sub.py 2>&1 | tee run.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "[i] Код возврата скрипта: ${RC}"

          # Если скрипт положил файл не туда — находим и копируем
          if [ ! -f output/sub.txt ]; then
            FOUND=$(find . -path ./gitverse_repo -prune -o -type f -name 'sub.txt' -print | head -n 1)
            if [ -n "${FOUND}" ]; then
              echo "[i] sub.txt найден в ${FOUND}, копирую в output/"
              cp "${FOUND}" output/sub.txt
            fi
          fi

          if [ ! -f output/sub.txt ]; then
            echo "[x] Скрипт не создал sub.txt. Последние строки лога:"
            tail -n 50 run.log
            echo "[i] Содержимое рабочей папки:"
            ls -laR output scripts 2>/dev/null | head -n 80
            exit 1
          fi

          if [ "${RC}" -ne 0 ]; then
            echo "[!] Скрипт завершился с кодом ${RC}, но sub.txt есть — продолжаю"
          fi

      - name: Check output
        run: |
          set -e

          if [ ! -f "output/sub.txt" ]; then
            echo "[x] output/sub.txt не найден"
            exit 1
          fi

          COUNT=$(grep -cE '^(vless|vmess|trojan|ss|ssr|hysteria2|hy2|tuic)://' output/sub.txt || true)

          echo "[i] Конфигов в результате: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "[x] Подписка пустая"
            exit 1
          fi

          echo "[+] Проверка результата пройдена"

      - name: Push result to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
          GITVERSE_REPO: ${{ secrets.PIZDUK_REPO }}
        run: |
          set -e

          if [ -z "${GITVERSE_TOKEN}" ]; then
            echo "[x] GITVERSE_TOKEN не задан"
            exit 1
          fi

          if [ -z "${GITVERSE_REPO}" ]; then
            echo "[x] GITVERSE_REPO не задан"
            exit 1
          fi

          git config --global user.email "actions@bots.local"
          git config --global user.name "sub-updater-bot"

          rm -rf gitverse_repo

          echo "[i] Клонирование GitVerse..."

          git clone --quiet \
            "https://oauth2:${GITVERSE_TOKEN}@${GITVERSE_REPO}" \
            gitverse_repo

          cp output/sub.txt gitverse_repo/sub.txt

          cd gitverse_repo

          git add sub.txt

          if git diff --cached --quiet; then
            echo "[i] Нет изменений"
            exit 0
          fi

          git commit \
            -m "auto: update subscription $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push origin HEAD

          echo "[+] Подписка успешно обновлена"

  trigger-others:
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Trigger BL and bahapp on GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.PIZDUK }}
        run: |
          set -e
          for wf in BL.yml bahapp.yml; do
            echo "[i] Запускаю $wf"
            CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST \
              "https://api.gitverse.ru/repos/Pizduk/Pars/actions/workflows/${wf}/dispatches?branch=master" \
              -H "Authorization: Bearer ${GITVERSE_TOKEN}" \
              -H "Accept: application/vnd.gitverse.object+json;version=1" \
              -H "Content-Type: application/json" \
              -d '{}')
            if [ "${CODE}" != "204" ]; then
              echo "[x] $wf: HTTP ${CODE}"
              cat resp.txt
              exit 1
            fi
            echo "[+] $wf запущен"
          done